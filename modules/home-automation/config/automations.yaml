- id: '1787370146974'
  alias: Read todo list
  triggers:
  - trigger: conversation
    id: shopping
    command:
    - what's on my shopping list
    - what is on my shopping list
    - read my shopping list
  - trigger: conversation
    id: inbox
    command:
    - what's in my inbox
    - what is in my inbox
    - read my inbox
    - what's on my todo list
    - what is on my todo list
    - read my todo list
    - What's on my To Do List
  actions:
  - variables:
      list_entity: "{{\n  {\n    'shopping': 'todo.shopping_list',\n    'inbox': 'todo.inbox'\n
        \ }[trigger.id]\n}}"
      list_name: "{{\n  {\n    'shopping': 'shopping list',\n    'inbox': 'todo list'\n
        \ }[trigger.id]\n}}"
  - action: todo.get_items
    target:
      entity_id: '{{ list_entity }}'
    data:
      status: needs_action
    response_variable: todo_items
  - set_conversation_response: "{% set items = todo_items[list_entity]['items']\n
      \   | map(attribute='summary')\n    | list %}\n{% if items %}\n  Your {{ list_name
      }} contains {{ items | join(', ') }}.\n{% else %}\n  Your {{ list_name }} is
      empty.\n{% endif %}"
- id: '1787370284075'
  alias: Voice - Add reminder to inbox
  triggers:
  - trigger: conversation
    command:
    - remind me to {item}
    - remember to {item}
    - add {item} to my inbox
  actions:
  - action: todo.add_item
    target:
      entity_id: todo.inbox
    data:
      item: '{{ trigger.slots.item }}'
  - set_conversation_response: Added {{ trigger.slots.item }} to your inbox.
  mode: parallel
