- id: '1786103283001'
  alias: Time Vibe Controller
  description: Modifies the state of input_select.time_vibe based on time triggers.
    This is required to more easily handle automations such a lighting that span across
    midnight. Naive 'after 9pm' fails after midnight.
  triggers:
  - trigger: sun
    event: sunrise
    offset: 0
    id: Day
  - trigger: sun
    event: sunset
    offset: 0
    id: Evening
  - trigger: time
    at: '21:00:00'
    id: Late
  - trigger: state
    entity_id:
    - sensor.dumberos_battery_state
    from:
    - discharging
    to:
    - charging
    id: Bedtime
  conditions:
  - alias: either
    condition: or
    conditions:
    - condition: not
      conditions:
      - condition: trigger
        id:
        - Bedtime
      alias: it's not bedtime
    - alias: We're charging at home and it's late
      condition: and
      conditions:
      - condition: state
        entity_id: input_select.time_vibe
        state:
        - Late
      - condition: zone.in_zone
        target:
          entity_id: person.dylan_johnston
        options:
          behavior: any
          for: 00:00:00
          zone: zone.home
        alias: Dylan is Home
  actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.time_vibe
    data:
      option: '{{ trigger.id }}'
  mode: single
- id: '1786104269565'
