- id: '1778686338218'
  alias: Kitchen Night Light
  description: Turns the kitchen task light on low when motion is detected late at
    night
  triggers:
  - id: 'on'
    trigger: state
    entity_id:
    - binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
    from:
    - 'off'
    to:
    - 'on'
  - id: 'off'
    trigger: state
    entity_id:
    - binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
    from:
    - 'on'
    to:
    - 'off'
  conditions:
  - condition: state
    entity_id: input_select.time_vibe
    state:
    - Bedtime
  actions:
  - choose:
    - alias: Turn On
      conditions:
      - condition: trigger
        id:
        - 'On'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.task_light_east
        data:
          transition: 2
          color_name: darkred
          brightness: 1
    - alias: Turn Off
      conditions:
      - condition: trigger
        id:
        - 'Off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.task_light
  mode: single
